<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proverbs Study Group</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f1ea;color:#333;min-height:100vh;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.6rem;
  background:linear-gradient(135deg,#6b4423,#8b5a2b);color:#fff;padding:.7rem 1.1rem;position:sticky;top:0;z-index:10;}
.topbar .brand{display:flex;align-items:center;gap:.55rem;font-weight:700;}
.topbar .logo{display:inline-flex;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);
  color:#c9a227;align-items:center;justify-content:center;font-size:1.15rem;}
.topbar .navbtns{display:flex;gap:.4rem;flex-wrap:wrap;}
.topbar button{background:rgba(255,255,255,.15);color:#fff;border:none;padding:.45rem .9rem;
  border-radius:6px;cursor:pointer;font-size:.95rem;transition:.2s;}
.topbar button:hover{background:rgba(255,255,255,.3);}
.topbar button.active{background:rgba(255,255,255,.35);font-weight:700;}
.topbar button.logout{background:rgba(180,40,40,.35);}
main{flex:1;max-width:900px;width:100%;margin:1.5rem auto;padding:0 1rem;}
.card{background:#fff;padding:1.5rem;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.08);margin-bottom:1.5rem;}
h2{color:#6b4423;margin-bottom:1rem;}
h3{color:#8b5a2b;margin:1rem 0 .5rem;}
label{display:block;margin:.5rem 0 .25rem;font-weight:600;}
input,select,textarea,button{width:100%;padding:.6rem;border:1px solid #ccc;border-radius:6px;font-size:1rem;margin-bottom:.75rem;font-family:inherit;}
textarea{min-height:80px;resize:vertical;}
button.primary{background:#6b4423;color:#fff;border:none;cursor:pointer;font-weight:bold;}
button.primary:hover{background:#8b5a2b;}
button.secondary{background:#eee;color:#333;border:none;cursor:pointer;}
.month-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.5rem;margin:1rem 0;}
.month-chip{padding:.5rem;background:#eee;border-radius:6px;text-align:center;cursor:pointer;border:2px solid transparent;}
.month-chip.selected{background:#6b4423;color:#fff;border-color:#8b5a2b;}
.member-list,.message-list{list-style:none;}
.member-list li,.message-list li{padding:.75rem;background:#faf7f2;border-left:4px solid #6b4423;margin-bottom:.5rem;border-radius:4px;}
.leader-badge{background:gold;padding:2px 8px;border-radius:12px;font-size:.8rem;margin-left:8px;}
.tips{background:#fff8e1;border-left:4px solid #f0c419;padding:1rem;border-radius:6px;margin-bottom:1rem;}
.tips ul{margin-left:1.2rem;}
.chapter-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
.bible-links a{display:inline-block;margin-right:.5rem;padding:.4rem .8rem;background:#6b4423;color:#fff;text-decoration:none;border-radius:4px;font-size:.9rem;margin-bottom:.4rem;}
.bible-links a:hover{background:#8b5a2b;}
.share-toggle{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;}
.share-toggle input{width:auto;margin:0;}
.answer-block{border:1px solid #ddd;padding:1rem;border-radius:6px;margin-bottom:1rem;}
.answer-block.shared{background:#eaf6ea;border-color:#6ab04c;}
.answer-block.private{background:#f9f9f9;}
footer{background:#6b4423;color:#fff;text-align:center;padding:1rem;margin-top:auto;}
@media (max-width:600px){header{padding:1rem;}header h1{font-size:1.3rem;}}
</style>
</head>
<body>
<header>
  <h1>📖 Proverbs Study Group</h1>
  <nav id="mainNav"></nav>
</header>

<main id="app"></main>

<footer>
  <p>&copy; 2026 Proverbs Study Group</p>
</footer>

<script>
// ========== DATA STORE ==========
const store = {
  get(key, fallback) {
    const val = localStorage.getItem(key);
    return val ? JSON.parse(val) : fallback;
  },
  set(key, value) {
    localStorage.setItem(key, JSON.stringify(value));
  }
};

// ========== STATE ==========
let state = {
  user: store.get('user', null),
  group: store.get('group', null),
  answers: store.get('answers', {}),
  messages: store.get('messages', []),
  bibleVersion: store.get('bibleVersion', 'NKJV')
};

function saveState() {
  store.set('user', state.user);
  store.set('group', state.group);
  store.set('answers', state.answers);
  store.set('messages', state.messages);
  store.set('bibleVersion', state.bibleVersion);
}

// ========== CONSTANTS ==========
const MONTHS_31 = ['January', 'March', 'May', 'July', 'August', 'October', 'December'];
const BIBLE_VERSIONS = ['NKJV', 'KJV', 'ESV', 'NIV', 'NLT'];

const RECOMMENDATIONS = [
  'Read early in your day.',
  'But better late than never.',
  "Share immediately when a verse connects with one of those questions for you. Don't wait.",
  'Respond to each other if you have thoughts about what we text each other.'
];

// ========== ROUTER ==========
function render() {
  renderNav();
  if (!state.user) return showSignup();
  if (!state.group) return showCreateGroup();
  showDashboard();
}

function renderNav() {
  const nav = document.getElementById('mainNav');
  if (!state.user) { nav.innerHTML = ''; return; }
  nav.innerHTML = `
    <button onclick="showDashboard()">Dashboard</button>
    <button onclick="showGroup()">Group</button>
    <button onclick="showMessages()">Messages</button>
    <button onclick="logout()">Logout</button>
  `;
}

// ========== SIGNUP ==========
function showSignup() {
  document.getElementById('app').innerHTML = `
    <div class="card">
      <h2>Welcome to Proverbs Study Group</h2>
      <p>Set up your profile to begin your 31-day journey through the book of Proverbs.</p>
      <label>Your Name</label>
      <input id="name" placeholder="e.g., Sarah Johnson" />
      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com" />
      <button class="primary" onclick="signup()">Get Started</button>
    </div>
  `;
}

function signup() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  if (!name || !email) { alert('Please enter both name and email.'); return; }
  state.user = { name, email, id: Date.now().toString() };
  saveState();
  render();
}

// ========== CREATE GROUP ==========
function showCreateGroup() {
  document.getElementById('app').innerHTML = `
    <div class="card">
      <h2>Create Your Study Group</h2>
      <label>Group Name</label>
      <input id="groupName" placeholder="e.g., Morning Wisdom" />

      <label>Add Group Members (name and phone or email, one per line)</label>
      <textarea id="members" placeholder="John Doe, john@email.com&#10;Jane Smith, 555-1234"></textarea>
      <p style="font-size:0.85rem;color:#777;">
        Note: Web apps cannot access your phone's contacts directly (that requires a native app).
        Enter each contact manually above.
      </p>

      <label>Select the Study Leader</label>
      <select id="leaderSelect">
        <option value="__me">${state.user.name} (You)</option>
      </select>

      <label>Select Study Months (only 31-day months available)</label>
      <div class="month-grid" id="monthGrid"></div>

      <label>Preferred Bible Version</label>
      <select id="version">
        ${BIBLE_VERSIONS.map(v => `<option value="${v}">${v}</option>`).join('')}
      </select>

      <button class="primary" onclick="createGroup()">Create Group</button>
    </div>
  `;

  const grid = document.getElementById('monthGrid');
  MONTHS_31.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'month-chip';
    chip.textContent = m;
    chip.onclick = () => chip.classList.toggle('selected');
    grid.appendChild(chip);
  });

  document.getElementById('members').addEventListener('input', updateLeaderDropdown);
}

function updateLeaderDropdown() {
  const raw = document.getElementById('members').value;
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  const sel = document.getElementById('leaderSelect');
  sel.innerHTML = `<option value="__me">${state.user.name} (You)</option>`;
  lines.forEach((line, idx) => {
    const name = line.split(',')[0].trim();
    sel.innerHTML += `<option value="${idx}">${name}</option>`;
  });
}

function createGroup() {
  const groupName = document.getElementById('groupName').value.trim();
  const raw = document.getElementById('members').value;
  const memberLines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  const selectedMonths = [...document.querySelectorAll('.month-chip.selected')].map(el => el.textContent);
  const leaderVal = document.getElementById('leaderSelect').value;
  const version = document.getElementById('version').value;

  if (!groupName) { alert('Group name required'); return; }
  if (selectedMonths.length === 0) { alert('Select at least one month'); return; }

  const members = [
    { name: state.user.name, contact: state.user.email, id: 'me' },
    ...memberLines.map((line, idx) => {
      const [name, contact] = line.split(',').map(s => (s || '').trim());
      return { name, contact: contact || '', id: `m${idx}` };
    })
  ];

  const leaderId = leaderVal === '__me' ? 'me' : `m${leaderVal}`;

  state.group = {
    name: groupName,
    members,
    leaderId,
    months: selectedMonths,
    createdAt: new Date().toISOString()
  };
  state.bibleVersion = version;
  saveState();
  render();
}

// ========== DASHBOARD ==========
function showDashboard() {
  const today = new Date();
  const day = today.getDate();
  const monthName = today.toLocaleString('default', { month: 'long' });
  const isStudyMonth = state.group.months.includes(monthName);
  const chapter = (day >= 1 && day <= 31) ? day : 1;

  const leader = state.group.members.find(m => m.id === state.group.leaderId);
  const isLeader = state.group.leaderId === 'me';

  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="chapter-header">
        <h2>Proverbs ${chapter}</h2>
        <div>
          <strong>${monthName} ${day}, ${today.getFullYear()}</strong>
          ${isStudyMonth ? '' : '<span style="color:#c00;"> (Not a scheduled study month)</span>'}
        </div>
      </div>

      <div class="tips">
        <strong>💡 Recommendations:</strong>
        <ul>${RECOMMENDATIONS.map(r => `<li>${r}</li>`).join('')}</ul>
      </div>

      <h3>Read Proverbs ${chapter} (${state.bibleVersion})</h3>
      <div class="bible-links">
        <a href="https://www.biblegateway.com/passage/?search=Proverbs+${chapter}&version=${state.bibleVersion}" target="_blank">Bible Gateway</a>
        <a href="https://www.biblehub.com/proverbs/${chapter}.htm" target="_blank">Bible Hub</a>
        <a href="https://www.bible.com/bible/search/search?q=Proverbs%20${chapter}" target="_blank">YouVersion</a>
      </div>
      <label>Change Bible Version</label>
      <select onchange="changeVersion(this.value)">
        ${BIBLE_VERSIONS.map(v => `<option ${v === state.bibleVersion ? 'selected' : ''}>${v}</option>`).join('')}
      </select>
    </div>

    <div class="card">
      <h3>Today's Reflection Questions</h3>
      ${renderQuestionForm(chapter)}
    </div>

    <div class="card">
      <h3>Shared Reflections from the Group</h3>
      ${renderSharedAnswers(chapter)}
    </div>

    ${isLeader ? renderLeaderTools() : ''}
    <p style="text-align:center;color:#777;font-size:0.9rem;">
      Study Leader: <strong>${leader.name}</strong>
      ${isLeader ? '<span class="leader-badge">You</span>' : ''}
    </p>
  `;
}

function renderQuestionForm(chapter) {
  const key = `chapter-${chapter}`;
  const saved = state.answers[key] || { q1: '', q2: '', q3: '', shared: { q1: false, q2: false, q3: false } };

  return `
    <label>1. Favorite verse or verses from the chapter? Why?</label>
    <textarea id="q1">${saved.q1}</textarea>
    <div class="share-toggle">
      <input type="checkbox" id="s1" ${saved.shared.q1 ? 'checked' : ''}/>
      <label for="s1">Share with group</label>
    </div>

    <label>2. A verse or verses that you think God is wanting to apply? How?</label>
    <textarea id="q2">${saved.q2}</textarea>
    <div class="share-toggle">
      <input type="checkbox" id="s2" ${saved.shared.q2 ? 'checked' : ''}/>
      <label for="s2">Share with group</label>
    </div>

    <label>3. A verse that you don't quite understand or want to talk about a little more.</label>
    <textarea id="q3">${saved.q3}</textarea>
    <div class="share-toggle">
      <input type="checkbox" id="s3" ${saved.shared.q3 ? 'checked' : ''}/>
      <label for="s3">Share with group</label>
    </div>

    <button class="primary" onclick="saveAnswers(${chapter})">Save Reflections</button>
  `;
}

function saveAnswers(chapter) {
  const key = `chapter-${chapter}`;
  state.answers[key] = {
    q1: document.getElementById('q1').value,
    q2: document.getElementById('q2').value,
    q3: document.getElementById('q3').value,
    shared: {
      q1: document.getElementById('s1').checked,
      q2: document.getElementById('s2').checked,
      q3: document.getElementById('s3').checked
    },
    date: new Date().toISOString(),
    userName: state.user.name
  };
  saveState();
  alert('Reflections saved!');
  showDashboard();
}

function renderSharedAnswers(chapter) {
  const key = `chapter-${chapter}`;
  const mine = state.answers[key];
  let html = '';
  if (mine) {
    const questions = [
      { q: 'Favorite verse', a: mine.q1, shared: mine.shared.q1 },
      { q: 'Verse God is applying', a: mine.q2, shared: mine.shared.q2 },
      { q: 'Verse to discuss', a: mine.q3, shared: mine.shared.q3 }
    ];

    questions.forEach(item => {
      if (item.shared && item.a) {
        html += `<div class="answer-block shared">
          <strong>${state.user.name}</strong> — <em>${item.q}</em>
          <p>${item.a}</p>
        </div>`;
      }
    });
  }
  return html || '<p style="color:#777;">No shared reflections yet. Check the "Share with group" boxes above to share yours.</p>';
}

function renderLeaderTools() {
  return `
    <div class="card">
      <h3>👑 Leader Tools</h3>
      <label>Send an encouragement or accountability message</label>
      <textarea id="leaderMsg" placeholder="Great job everyone! Keep pressing on..."></textarea>
      <label>Send to</label>
      <select id="msgTarget">
        <option value="group">Whole Group</option>
        ${state.group.members.filter(m => m.id !== 'me').map(m => `<option value="${m.id}">${m.name}</option>`).join('')}
      </select>
      <button class="primary" onclick="sendLeaderMessage()">Send Message</button>
    </div>
  `;
}

function sendLeaderMessage() {
  const text = document.getElementById('leaderMsg').value.trim();
  const target = document.getElementById('msgTarget').value;
  if (!text) return;
  const targetName = target === 'group' ? 'Whole Group' :
    state.group.members.find(m => m.id === target).name;
  state.messages.push({
    from: state.user.name,
    to: targetName,
    text,
    date: new Date().toISOString()
  });
  saveState();
  alert('Message sent!');
  showDashboard();
}

function changeVersion(v) {
  state.bibleVersion = v;
  saveState();
  showDashboard();
}

// ========== GROUP VIEW ==========
function showGroup() {
  const leader = state.group.members.find(m => m.id === state.group.leaderId);
  document.getElementById('app').innerHTML = `
    <div class="card">
      <h2>${state.group.name}</h2>
      <p><strong>Study Months:</strong> ${state.group.months.join(', ')}</p>
      <p><strong>Leader:</strong> ${leader.name}</p>
      <h3>Members</h3>
      <ul class="member-list">
        ${state.group.members.map(m => `
          <li>
            ${m.name}${m.id === state.group.leaderId ? '<span class="leader-badge">Leader</span>' : ''}
            <br><small>${m.contact || 'No contact info'}</small>
          </li>
        `).join('')}
      </ul>
    </div>
  `;
}

// ========== MESSAGES ==========
function showMessages() {
  document.getElementById('app').innerHTML = `
    <div class="card">
      <h2>Messages</h2>
      ${state.messages.length === 0
        ? '<p style="color:#777;">No messages yet.</p>'
        : `<ul class="message-list">
            ${state.messages.slice().reverse().map(m => `
              <li>
                <strong>${m.from}</strong> → ${m.to}<br>
                <em>${new Date(m.date).toLocaleString()}</em>
                <p>${m.text}</p>
              </li>
            `).join('')}
          </ul>`
      }
    </div>
  `;
}

// ========== LOGOUT ==========
function logout() {
  if (confirm('Log out and clear all local data?')) {
    localStorage.clear();
    state = { user: null, group: null, answers: {}, messages: [], bibleVersion: 'NKJV' };
    render();
  }
}

// ========== DAILY REMINDER (browser notifications) ==========
function requestNotifications() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function checkDailyReminder() {
  const today = new Date().toDateString();
  const lastReminder = localStorage.getItem('lastReminder');
  if (lastReminder !== today && Notification.permission === 'granted') {
    const monthName = new Date().toLocaleString('default', { month: 'long' });
    if (state.group && state.group.months.includes(monthName)) {
      new Notification('📖 Proverbs Study Reminder', {
        body: `Time to read Proverbs ${new Date().getDate()} today!`
      });
      localStorage.setItem('lastReminder', today);
    }
  }
}

// ========== INIT ==========
requestNotifications();
render();
setInterval(checkDailyReminder, 60 * 60 * 1000);
checkDailyReminder();
</script>
</body>
</html>
